---
- name: Stop VTC client experiment processes
  hosts: vtc_clients
  gather_facts: false

  tasks:
    - name: Schedule VTC client cleanup
      ansible.builtin.shell: |
        set -u
        display={{ vtc_display | default(':99') | quote }}
        display_num="${display#:}"
        video_device={{ video_device | default('/dev/video5') | quote }}
        screen_share_title={{ screen_share_window_title | default('VTC Share Window') | quote }}
        screen_share_url={{ screen_share_window_url | default('') | quote }}

        rm -f /tmp/vtc-stop-client.done
        cat > /tmp/vtc-stop-client.sh <<EOF
        #!/usr/bin/env bash
        set +e
        video_device="${video_device}"
        display="${display}"
        display_num="${display_num}"
        screen_share_title="${screen_share_title}"
        screen_share_url="${screen_share_url}"

        pkill -f '[v]tc_traffic_generator/vtc_generator.py'
        pkill -f "[f]fmpeg.*\${video_device}"
        pkill -f '[r]un-jitsi.sh'
        pkill -f '[e]lectron.*jitsi'
        pkill -f '[j]itsi.*electron'
        pkill -x dumpcap
        pkill -x tshark
        pkill -x x11vnc
        pkill -f "[x]term.*\${screen_share_title}"

        if [ -n "\${screen_share_url}" ]; then
          pkill -f "[c]hromium.*\${screen_share_url}"
          pkill -f "[c]hromium-browser.*\${screen_share_url}"
          pkill -f "[g]oogle-chrome.*\${screen_share_url}"
          pkill -f "[f]irefox.*\${screen_share_url}"
        fi

        pkill -x openbox
        pkill -f "[X]vfb \${display}"

        export XDG_RUNTIME_DIR="/run/user/$(id -u)"
        systemctl --user stop pulseaudio.service pulseaudio.socket >/dev/null 2>&1 || true
        pulseaudio --kill >/dev/null 2>&1 || true
        for _ in $(seq 1 5); do
          pkill -x pulseaudio >/dev/null 2>&1 || true
          if ! pgrep -x pulseaudio >/dev/null 2>&1; then
            break
          fi
          sleep 0.5
        done
        rm -f "/tmp/.X\${display_num}-lock" "/tmp/.X11-unix/X\${display_num}"
        touch /tmp/vtc-stop-client.done
        EOF

        chmod 0755 /tmp/vtc-stop-client.sh
        nohup /tmp/vtc-stop-client.sh >/tmp/vtc-stop-client.log 2>&1 &
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for VTC client cleanup to finish
      ansible.builtin.wait_for:
        path: /tmp/vtc-stop-client.done
        timeout: 20
