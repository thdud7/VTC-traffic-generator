---
- name: Deploy and start VTC clients
  hosts: vtc_clients
  gather_facts: false

  tasks:
    - name: Ensure repository parent directory exists
      ansible.builtin.file:
        path: "{{ repo_dir | dirname }}"
        state: directory
        mode: "0755"

    - name: Clone or update repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ repo_version | default('main') }}"
        update: true
        accept_hostkey: true
      when: repo_url is defined

    - name: Pull latest repository changes
      ansible.builtin.command: git pull --ff-only
      args:
        chdir: "{{ repo_dir }}"
      when: repo_url is not defined

    - name: Allow non-root packet capture package setup
      become: true
      ansible.builtin.shell: |
        echo "wireshark-common wireshark-common/install-setuid boolean true" | debconf-set-selections
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install client runtime tools
      become: true
      ansible.builtin.apt:
        name:
          - ffmpeg
          - libcap2-bin
          - python3-pip
          - python3-pulsectl
          - python3-venv
          - snapd
          - tshark
          - wmctrl
          - xdotool
          - x11-utils
          - x11vnc
          - xdg-utils
          - xvfb
          - openbox
          - xterm
        state: present
        update_cache: true

    - name: Install AWS CLI when missing
      become: true
      ansible.builtin.shell: |
        if command -v aws >/dev/null 2>&1; then
          exit 0
        fi

        snap install aws-cli --classic
      args:
        executable: /bin/bash
      changed_when: false

    - name: Disable desktop services not needed for VTC capture
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        for unit in \
          cups.service \
          cups-browsed.service \
          snap.cups.cupsd.service \
          snap.cups.cups-browsed.service \
          ModemManager.service \
          packagekit.service \
          fwupd.service
        do
          if systemctl list-unit-files "$unit" >/dev/null 2>&1; then
            systemctl disable --now "$unit" >/dev/null 2>&1 || true
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure swap is available for Electron clients
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        swap_file=/swapfile
        swap_size_mb=2048

        if ! swapon --show=NAME --noheadings | grep -Fx "$swap_file" >/dev/null 2>&1; then
          if [ ! -f "$swap_file" ]; then
            fallocate -l "${swap_size_mb}M" "$swap_file" || dd if=/dev/zero of="$swap_file" bs=1M count="$swap_size_mb"
            chmod 0600 "$swap_file"
            mkswap "$swap_file" >/dev/null
          fi
          swapon "$swap_file"
        fi

        if ! grep -Eq "^${swap_file}[[:space:]]+none[[:space:]]+swap[[:space:]]" /etc/fstab; then
          printf '%s none swap sw 0 0\n' "$swap_file" >> /etc/fstab
        fi

        printf 'vm.swappiness=10\n' > /etc/sysctl.d/99-vtc-swap.conf
        sysctl -q -p /etc/sysctl.d/99-vtc-swap.conf
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install Python media dependencies when missing
      ansible.builtin.shell: |
        set -euo pipefail
        if ! {{ python_bin | default('python3') }} -c 'import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("ffmpeg") else 1)'; then
          {{ python_bin | default('python3') }} -m pip install --user --break-system-packages ffmpeg-python
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Allow dumpcap to capture without sudo
      become: true
      ansible.builtin.shell: |
        dumpcap_path="$(command -v dumpcap)"
        setcap cap_net_raw,cap_net_admin=eip "$dumpcap_path"
        chmod 0755 "$dumpcap_path"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure generated config directory exists
      ansible.builtin.file:
        path: "{{ remote_config_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Ensure client log directory exists
      ansible.builtin.file:
        path: "{{ client_log_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Ensure v4l2loopback is loaded
      become: true
      ansible.builtin.shell: |
        if ! lsmod | grep -q '^v4l2loopback'; then
          modprobe v4l2loopback video_nr={{ video_nr | default(5) }} exclusive_caps=1
        fi
        test -e {{ video_device | default('/dev/video5') }}
        usermod -aG video {{ ansible_user | default('ubuntu') }}
        chmod 0666 {{ video_device | default('/dev/video5') }}
      args:
        executable: /bin/bash

    - name: Start PulseAudio
      ansible.builtin.shell: |
        if ! pactl info >/dev/null 2>&1; then
          pulseaudio --kill >/dev/null 2>&1 || true
          rm -rf "/run/user/$(id -u)/pulse" "$HOME/.config/pulse"
          pulseaudio --start
          sleep 1
        fi
        pactl info >/dev/null
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure VTC virtual audio devices exist before preflight
      ansible.builtin.shell: |
        set -euo pipefail
        sink_name={{ audio_sink_name | default('VTC_Speaker') | quote }}
        source_name={{ audio_source_name | default('VTC_Microphone') | quote }}
        sink_description={{ audio_sink_description | default('VTC_Speaker') | quote }}
        source_description={{ audio_source_description | default('VTC_Microphone') | quote }}

        if ! pactl list short sinks | awk '{print $2}' | grep -Fx "$sink_name" >/dev/null 2>&1; then
          pactl load-module module-null-sink \
            "sink_name=$sink_name" \
            "sink_properties=device.description=$sink_description" >/dev/null
        fi

        if ! pactl list short sources | awk '{print $2}' | grep -Fx "$source_name" >/dev/null 2>&1; then
          pactl load-module module-remap-source \
            "master=$sink_name.monitor" \
            "source_name=$source_name" \
            "source_properties=device.description=$source_description" >/dev/null
        fi

        pactl set-default-sink "$sink_name"
        pactl set-default-source "$source_name"
        pactl set-sink-mute "$sink_name" 0
        pactl set-source-mute "$source_name" 0
        pactl set-sink-volume "$sink_name" 80%
        pactl set-source-volume "$source_name" 80%
        pactl list short sinks | awk '{print $2}' | grep -Fx "$sink_name" >/dev/null
        pactl list short sources | awk '{print $2}' | grep -Fx "$source_name" >/dev/null
      args:
        executable: /bin/bash
      changed_when: false

    - name: Start Xvfb and openbox
      ansible.builtin.shell: |
        set -euo pipefail
        display={{ vtc_display | default(":99") | quote }}
        display_num="${display#:}"

        if ! DISPLAY="$display" xdpyinfo >/dev/null 2>&1; then
          pkill -x Xvfb >/dev/null 2>&1 || true
          rm -f "/tmp/.X${display_num}-lock" "/tmp/.X11-unix/X${display_num}"
          nohup Xvfb "$display" -screen 0 1280x720x24 -ac > /tmp/vtc-xvfb.log 2>&1 &

          for _ in $(seq 1 10); do
            if DISPLAY="$display" xdpyinfo >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
        fi

        DISPLAY="$display" xdpyinfo >/dev/null

        if ! pgrep -x openbox >/dev/null 2>&1 || ! DISPLAY="$display" wmctrl -m >/dev/null 2>&1; then
          pkill -x openbox >/dev/null 2>&1 || true
          for _ in $(seq 1 20); do
            if ! pgrep -x openbox >/dev/null 2>&1; then
              nohup setsid env DISPLAY="$display" openbox --replace > /tmp/vtc-openbox.log 2>&1 &
            fi
            if pgrep -x openbox >/dev/null 2>&1 && DISPLAY="$display" wmctrl -m >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
        fi

        pgrep -x openbox >/dev/null
        DISPLAY="$display" wmctrl -m >/dev/null
      args:
        executable: /bin/bash
      changed_when: false

    - name: Enable desktop accessibility for UI automation
      ansible.builtin.shell: |
        dbus-run-session -- gsettings set org.gnome.desktop.interface toolkit-accessibility true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Start x11vnc for VNC access
      ansible.builtin.shell: |
        set -euo pipefail
        display={{ vtc_display | default(":99") | quote }}
        vnc_password_file="$HOME/.vnc/passwd"

        mkdir -p "$HOME/.vnc"
        chmod 0700 "$HOME/.vnc"
        x11vnc -storepasswd "123456" "$vnc_password_file" >/dev/null
        chmod 0600 "$vnc_password_file"

        if ps -C x11vnc -o args= | grep -F -- "-rfbport 5900" | grep -F -- "-viewonly" >/dev/null 2>&1 \
          && ss -ltnp 2>/dev/null | grep -F ":5900" >/dev/null 2>&1; then
          exit 0
        fi

        pkill -x x11vnc >/dev/null 2>&1 || true
        x11vnc \
          -display "$display" \
          -rfbauth "$vnc_password_file" \
          -rfbport 5900 \
          -forever \
          -shared \
          -viewonly \
          -noxdamage \
          -repeat \
          -bg \
          -o /tmp/vtc-x11vnc.log \
          >/tmp/vtc-x11vnc.nohup 2>&1

        sleep 1
        pgrep -x x11vnc >/dev/null
        ss -ltnp 2>/dev/null | grep -F ":5900" >/dev/null
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure screen share window directory exists
      ansible.builtin.file:
        path: "{{ screen_share_window_html_path | default('/home/ubuntu/vtc_data/screen_share/share.html') | dirname }}"
        state: directory
        mode: "0755"
      when: screen_share_window_enabled | default(false) | bool

    - name: Create screen share HTML page
      ansible.builtin.copy:
        dest: "{{ screen_share_window_html_path | default('/home/ubuntu/vtc_data/screen_share/share.html') }}"
        mode: "0644"
        content: |
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>{{ screen_share_window_title | default('VTC Share Window') }}</title>
            <style>
              html, body {
                height: 100%;
                margin: 0;
                background: #f4f6f8;
                color: #17202a;
                font-family: Arial, sans-serif;
              }
              body {
                display: grid;
                place-items: center;
              }
              main {
                width: 82vw;
                max-width: 960px;
              }
              h1 {
                font-size: 56px;
                margin: 0 0 24px;
              }
              p {
                font-size: 28px;
                line-height: 1.4;
                margin: 0;
              }
              .marker {
                width: 100%;
                height: 180px;
                margin-top: 32px;
                background:
                  linear-gradient(45deg, {{ screen_share_marker_color | default('#111111') }} 25%, transparent 25%),
                  linear-gradient(-45deg, {{ screen_share_marker_color | default('#111111') }} 25%, transparent 25%),
                  linear-gradient(45deg, transparent 75%, {{ screen_share_marker_color | default('#111111') }} 75%),
                  linear-gradient(-45deg, transparent 75%, {{ screen_share_marker_color | default('#111111') }} 75%);
                background-size: 48px 48px;
                background-position: 0 0, 0 24px, 24px -24px, -24px 0;
                border: 8px solid #000;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>{{ screen_share_run_id | default('vtc-run') }}</h1>
              <p>bot={{ inventory_hostname }}</p>
              <p>nonce={{ screen_share_nonce | default('missing-nonce') }}</p>
              <p>utc=<span id="utc"></span></p>
              <p>counter=<span id="counter">0</span></p>
              <div class="marker"></div>
            </main>
            <script>
              let counter = 0;
              function tick() {
                document.getElementById('utc').textContent = new Date().toISOString();
                document.getElementById('counter').textContent = counter++;
              }
              tick();
              setInterval(tick, 1000);
            </script>
          </body>
          </html>
      when: screen_share_window_enabled | default(false) | bool

    - name: Start screen share window
      ansible.builtin.shell: |
        set -euo pipefail
        title={{ screen_share_window_title | default('VTC Share Window') | quote }}
        target_url={{ screen_share_window_url | default('file:///home/ubuntu/vtc_data/screen_share/share.html') | quote }}
        run_id={{ screen_share_run_id | default('vtc-run') | quote }}
        nonce={{ screen_share_nonce | default('missing-nonce') | quote }}
        marker_color={{ screen_share_marker_color | default('#111111') | quote }}
        escaped_title="$(printf '%s' "$title" | sed 's/[][(){}.^$*+?|\\]/\\&/g')"
        title_regex="^${escaped_title}$"

        if pgrep -af xterm | grep -F -- "-T $title" >/dev/null 2>&1; then
          existing_count="$(DISPLAY={{ vtc_display | default(":99") }} xdotool search --onlyvisible --name "$title_regex" 2>/dev/null | wc -l | tr -d ' ')"
          test "$existing_count" -eq 1
          exit 0
        fi

        if DISPLAY={{ vtc_display | default(":99") }} xdotool search --onlyvisible --name "$title_regex" >/dev/null 2>&1; then
          existing_count="$(DISPLAY={{ vtc_display | default(":99") }} xdotool search --onlyvisible --name "$title_regex" 2>/dev/null | wc -l | tr -d ' ')"
          test "$existing_count" -eq 1
          exit 0
        fi

        pkill -f '[x]term .*VTC Share Window' >/dev/null 2>&1 || true

        browser="$(command -v xterm || command -v chromium-browser || command -v chromium || command -v google-chrome || command -v firefox || true)"
        if [ -z "$browser" ]; then
          echo "No supported browser or xterm found for screen share window" >&2
          exit 1
        fi

        case "$(basename "$browser")" in
          chromium|chromium-browser|google-chrome)
            nohup env DISPLAY={{ vtc_display | default(":99") }} "$browser" \
              --new-window \
              --no-first-run \
              --disable-session-crashed-bubble \
              --disable-infobars \
              "$target_url" > /tmp/vtc-screen-share-window.log 2>&1 &
            ;;
          firefox)
            nohup env DISPLAY={{ vtc_display | default(":99") }} "$browser" \
              --new-window "$target_url" > /tmp/vtc-screen-share-window.log 2>&1 &
            ;;
          xterm)
            nohup setsid env DISPLAY={{ vtc_display | default(":99") }} "$browser" \
              -T "$title" \
              -e bash -lc 'counter=0; while true; do clear; printf "%s\n\nRUN_ID=%s\nbot=%s\nnonce=%s\nutc=%s\ncounter=%s\n\n%s\n%s\n%s\n" "$0" "$1" "$2" "$3" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$counter" "$4" "## ## ## ## ## ## ## ##" "  ## ## ## ## ## ## ##"; counter=$((counter+1)); sleep 1; done' "$title" "$run_id" "{{ inventory_hostname }}" "$nonce" "$marker_color" \
              > /tmp/vtc-screen-share-window.log 2>&1 &
            ;;
        esac

        sleep 2
        DISPLAY={{ vtc_display | default(":99") }} wmctrl -r "$title" -b add,above || true
        window_count="$(DISPLAY={{ vtc_display | default(":99") }} xdotool search --onlyvisible --name "$title_regex" 2>/dev/null | wc -l | tr -d ' ')"
        if [ "$window_count" -ne 1 ]; then
          echo "Expected exactly one screen share window titled '$title', found $window_count" >&2
          DISPLAY={{ vtc_display | default(":99") }} xdotool search --onlyvisible --name '.*' getwindowname %@ >&2 || true
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
      when: screen_share_window_enabled | default(false) | bool

    - name: Verify Jitsi Electron launcher exists
      ansible.builtin.stat:
        path: "{{ jitsi_electron_launcher | default('/home/ubuntu/service/jitsi-electron/run-jitsi.sh') }}"
      register: jitsi_launcher

    - name: Fail if Jitsi Electron launcher is missing
      ansible.builtin.fail:
        msg: "Missing {{ jitsi_electron_launcher | default('/home/ubuntu/service/jitsi-electron/run-jitsi.sh') }} on {{ inventory_hostname }}"
      when: not jitsi_launcher.stat.exists

    - name: Copy generated client config
      ansible.builtin.copy:
        src: "{{ bot_config_src }}"
        dest: "{{ remote_config_path }}"
        mode: "0644"

    - name: Stop existing VTC client process
      ansible.builtin.shell: |
        video_device={{ video_device | default('/dev/video5') | quote }}
        pkill -f '[v]tc_traffic_generator/vtc_generator.py' || true
        pkill -f "[f]fmpeg.*${video_device}" || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Start VTC client process
      ansible.builtin.shell: |
        nohup {{ python_bin | default('python3') }} vtc_traffic_generator/vtc_generator.py {{ remote_config_path }} > {{ client_log_path }} 2>&1 &
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash

    - name: Wait for VTC client control port
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ c2_port | default(8001) }}"
        timeout: 20

    - name: Ensure openbox remains available after startup
      ansible.builtin.shell: |
        set -euo pipefail
        display={{ vtc_display | default(":99") | quote }}

        if pgrep -x openbox >/dev/null 2>&1 && DISPLAY="$display" wmctrl -m >/dev/null 2>&1; then
          exit 0
        fi

        pkill -x openbox >/dev/null 2>&1 || true
        nohup setsid env DISPLAY="$display" openbox --replace > /tmp/vtc-openbox.log 2>&1 &

        for _ in $(seq 1 10); do
          if pgrep -x openbox >/dev/null 2>&1 && DISPLAY="$display" wmctrl -m >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done

        DISPLAY="$display" wmctrl -m
      args:
        executable: /bin/bash
      changed_when: false
