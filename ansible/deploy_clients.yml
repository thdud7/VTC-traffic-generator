---
- name: Deploy and start VTC clients
  hosts: vtc_clients
  gather_facts: false

  tasks:
    - name: Clone or update repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ repo_version | default('main') }}"
        update: true
        accept_hostkey: true
      when: repo_url is defined

    - name: Pull latest repository changes
      ansible.builtin.command: git pull --ff-only
      args:
        chdir: "{{ repo_dir }}"
      when: repo_url is not defined

    - name: Ensure generated config directory exists
      ansible.builtin.file:
        path: "{{ remote_config_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Ensure client log directory exists
      ansible.builtin.file:
        path: "{{ client_log_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Copy generated client config
      ansible.builtin.copy:
        src: "{{ bot_config_src }}"
        dest: "{{ remote_config_path }}"
        mode: "0644"

    - name: Stop existing VTC client process
      ansible.builtin.shell: pkill -f '[v]tc_traffic_generator/vtc_generator.py' || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Start VTC client process
      ansible.builtin.shell: |
        nohup {{ python_bin | default('python3') }} vtc_traffic_generator/vtc_generator.py {{ remote_config_path }} > {{ client_log_path }} 2>&1 &
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash

    - name: Wait for VTC client control port
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ c2_port | default(8001) }}"
        timeout: 20
